
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
        }
    </style>
</head>

<body>

<a-scene hands renderer="alpha: true" background="transparent: true">

    <a-box
        position="0 1 -3"
        width="4.5"
        height="2"
        depth="0.1"
        color="#aaaaaa">
    </a-box>

    <a-box position="-0.85 0.55 -2.93"
        width="1.8" height="0.5" depth="0.03"
        color="white">
    </a-box>

    <a-box position="0.05 1.0 -2.93"
        width="0.5" height="1.0" depth="0.03"
        color="white">
    </a-box>

    <a-box position="0.95 1.45 -2.93"
        width="2.0" height="0.5" depth="0.03"
        color="white">
    </a-box>

    <a-sphere
        id="start"
        position="-1.75 0.55 -2.85"
        radius="0.16"
        color="#4caf70">
    </a-sphere>

    <a-text
        value="START"
        position="-1.9 0.1 -2.8"
        color="white"
        width="2">
    </a-text>

    <a-sphere
        id="goal"
        position="1.75 1.45 -2.85"
        radius="0.16"
        color="#ffb51b">
    </a-sphere>

    <a-text
        value="GOAL"
        position="1.25 1.0 -2.8"
        color="white"
        width="2">
    </a-text>

    <a-entity hand-anchor="index:8" id="player">

        <a-sphere
            id="playerMarker"
            color="#1685d8"
            radius="0.16"
            position="0 0.2 0"
            visible="true">
        </a-sphere>

    </a-entity>

    <a-text
        id="message"
        value="STARTに指を触れてね！"
        position="-1.8 2.3 -2.8"
        color="white"
        width="4">
    </a-text>

    <a-entity
        camera
        position="0 1 -0.5"
        rotation="0 0 0">
    </a-entity>

</a-scene>

<script>

const scene = document.querySelector("a-scene");

const marker = document.querySelector("#playerMarker");
const start = document.querySelector("#start");
const goal = document.querySelector("#goal");
const message = document.querySelector("#message");

let started = false;
let gameOver = false;

function getPosition(object) {

    const pos = new THREE.Vector3();

    object.object3D.getWorldPosition(pos);

    return pos;

}

function distance2D(a, b) {

    const dx = a.x - b.x;
    const dy = a.y - b.y;

    return Math.sqrt(dx * dx + dy * dy);

}

function isOnCourse(pos) {

    const bottom =
        pos.x >= -1.8 && pos.x <= -0.05 &&
        pos.y >= 0.3 && pos.y <= 0.8;

    const middle =
        pos.x >= -0.2 && pos.x <= 0.3 &&
        pos.y >= 0.3 && pos.y <= 1.7;

    const top =
        pos.x >= -0.05 && pos.x <= 2.0 &&
        pos.y >= 1.2 && pos.y <= 1.7;

    return bottom || middle || top;

}

function finishGame() {

    gameOver = true;
    message.setAttribute("value", "GAME OVER!");
    message.setAttribute("color", "red");

}

function clearGame() {
    gameOver = true;
    message.setAttribute("value", "CLEAR!!");
    message.setAttribute("color", "yellow");
}

function gameLoop() {

    if (gameOver) return;

    const playerPos = getPosition(marker);

    
    const startPos = getPosition(start);

    if (!started) {

        const startDistance = distance2D(
            playerPos,
            startPos
        );

        if (startDistance <= 0.32) {

            started = true;

            message.setAttribute(
                "value",
                "GOALを目指せ"
            );

            message.setAttribute(
                "color",
                "white"
            );

        }

        requestAnimationFrame(gameLoop);
        return;
    }
    const goalPos = getPosition(goal);

    const goalDistance = distance2D(
        playerPos,
        goalPos
    );

    if (goalDistance <= 0.32) {

        clearGame();
        return;

    }

    if (!isOnCourse(playerPos)) {
        finishGame();
        return;
    }

    requestAnimationFrame(gameLoop);

}
scene.addEventListener("loaded", function() {
    gameLoop();
});

</script>

</body>
</html>
